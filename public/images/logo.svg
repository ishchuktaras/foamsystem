<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 130" width="100%" height="100%">
  <defs>
    <style>
      .text-izolace { 
        font-family: 'Roboto', sans-serif; 
        font-size: 65px; 
        font-weight: 700; 
        font-style: italic; 
        fill: #FFFFFF; 
      }
      .text-rs { 
        font-family: 'Roboto', sans-serif; 
        font-size: 65px; 
        font-weight: 900; 
        font-style: italic; 
        fill: #FF4F00; 
      }
      .bolt { 
        fill: #FF4F00; 
      }
      .subtitle { 
        font-family: 'Roboto', sans-serif; 
        font-size: 16px; 
        font-weight: 700; 
        fill: #A0A0A0; 
        letter-spacing: 2.5px; 
      }
    </style>
  </defs>
  
  <!-- Celá skupina je nakloněná, aby simulovala dynamiku loga na autě -->
  <g transform="skewX(-15) translate(30, 20)">
    
    <!-- Stylizovaný blesk před nápisem -->
    <path class="bolt" d="M 35 95 L 65 45 L 40 45 L 75 0 L 45 45 L 70 45 Z" />
    
    <!-- Texty s využitím tspan pro přesnou mezeru nezávisle na fontu -->
    <text y="80">
      <tspan x="85" class="text-izolace">IZOLACE</tspan>
      <tspan dx="15" class="text-rs">RS</tspan>
    </text>
    
    <!-- Drobný podtitul -->
    <text x="90" y="105" class="subtitle">STŘÍKANÉ IZOLACE</text>
  </g>
</svg>
